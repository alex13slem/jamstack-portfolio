backend:
  name: github
  branch: main
  repo: alex13slem/jamstack-portfolio

media_folder: public/media
public_folder: /media
media_libraries:
  default:
    config:
      slugify_filename: true

editor:
  preview: false
i18n:
  structure: multiple_folders
  locales: ["en", "ru"]

collections:
  - name: tech
    label: Technologies
    label_singular: Technology
    folder: src/content/tech
    media_folder: /public/media/tech
    public_folder: /media/tech
    create: true
    i18n: true
    slug: "{{id}}"

    fields:
      - name: id
        label: ID
        i18n: duplicate

      - name: name
        label: Name
        i18n: translate

      - name: url
        label: URL
        i18n: duplicate

      - name: iconify_id
        label: Iconify ID
        i18n: duplicate

      - name: show_in_ribbon
        label: Also Show in Technology Ribbon
        widget: boolean
        default: false
        i18n: duplicate
        hint: Technologies used in projects or visible work experience are included automatically.

  - name: project
    label: Projects
    label_singular: Project
    folder: src/content/project
    media_folder: /public/media/project
    public_folder: /media/project
    create: true
    i18n: true
    slug: "{{id}}"

    fields:
      - name: id
        label: ID
        i18n: duplicate

      - name: order
        label: Display Order
        widget: number
        value_type: int
        default: 100
        min: 0
        step: 1
        i18n: duplicate

      - name: name
        label: Name
        i18n: translate

      - widget: text
        name: description
        label: Description
        i18n: translate

      - name: card_summary
        label: Short Card Description
        widget: string
        i18n: translate
        pattern: ["^.{1,160}$", "Use between 1 and 160 characters."]

      - widget: markdown
        name: body
        label: Body
        i18n: translate

      - name: role
        label: Role
        i18n: translate

      - name: site_url
        label: Site Link
        i18n: duplicate
        required: false

      - name: github_url
        label: GitHub Link
        i18n: duplicate
        required: false

      - widget: image
        name: image_cover
        label: Image Cover
        i18n: duplicate

      - widget: image
        name: image_preview
        label: Image Preview
        i18n: duplicate

      - widget: relation
        collection: tech
        i18n: duplicate
        name: techs
        multiple: true
        label: Technologies
        required: false

      - name: gallery
        label: Project Gallery
        widget: list
        required: false
        i18n: translate
        summary: "{{fields.caption}}"
        fields:
          - name: image
            label: Image
            widget: image
            i18n: duplicate
          - name: caption
            label: Caption
            widget: text
            required: false
            i18n: translate
          - name: alt
            label: Image Description
            widget: string
            i18n: translate
            hint: Describe what the screenshot shows for screen reader users.

  - name: experience
    label: Work Experience
    label_singular: Role
    folder: src/content/experience
    create: true
    i18n: true
    slug: "{{id}}"
    identifier_field: company
    summary: "{{company}} — {{role}}"
    sortable_fields: [order, company, start_date]
    fields:
      - name: id
        label: ID
        widget: string
        i18n: duplicate

      - name: company
        label: Company
        widget: string
        i18n: duplicate

      - name: role
        label: Role
        widget: string
        i18n: translate

      - name: description
        label: Responsibilities
        widget: text
        i18n: translate

      - name: start_date
        label: Start Month
        widget: datetime
        type: date
        format: YYYY-MM
        i18n: duplicate
        hint: Only the month and year are stored and displayed.

      - name: end_date
        label: End Month
        widget: datetime
        type: date
        format: YYYY-MM
        required: false
        i18n: duplicate
        hint: Leave empty for a current role. Only the month and year are stored.

      - name: work_mode
        label: Work Arrangement
        widget: string
        required: false
        i18n: translate
        hint: For example Remote or Hybrid.

      - name: order
        label: Display Order
        widget: number
        value_type: int
        default: 100
        min: 0
        step: 1
        i18n: duplicate

      - name: visible
        label: Show on Website
        widget: boolean
        default: true
        i18n: duplicate

      - name: techs
        label: Technologies
        widget: relation
        collection: tech
        value_field: id
        display_fields: [name]
        search_fields: [name, id]
        multiple: true
        required: false
        i18n: duplicate

  - name: social
    label: Social
    label_singular: Social
    folder: src/content/social
    media_folder: /public/media/social
    public_folder: /media/social
    create: true
    i18n: true
    slug: "{{id}}"

    fields:
      - name: id
        label: ID
        i18n: duplicate

      - name: name
        label: Name
        i18n: translate

      - name: url
        label: URL
        i18n: duplicate

      - name: iconify_id
        label: Iconify ID
        i18n: duplicate

singletons:
  - name: site_info
    label: Site Info
    file: src/common/config.json
    format: json
    media_folder: /public/media/site-info
    public_folder: /media/site-info
    i18n: true

    fields:
      - name: site_name
        label: Site Name
        i18n: translate

      - widget: text
        name: site_description
        label: Site Description
        i18n: translate

      - widget: string
        name: site_title
        label: Search Title
        i18n: translate
        hint: Social images are generated automatically from site and project content.

      - name: social_technologies
        label: Home Social Image Technologies
        widget: list
        max: 4
        required: false
        i18n: duplicate
        hint: Up to four short technology names for the home page preview.

      - widget: object
        name: hero_contact
        label: Hero Contact
        i18n: translate
        fields:
          - name: email
            label: Email
            i18n: translate
          - name: phone
            label: Phone
            i18n: translate

      - widget: object
        name: section_hero
        label: Section Hero
        i18n: translate
        fields:
          - widget: list
            name: epithets
            label: Epithets
            i18n: translate
          - widget: string
            name: epithet_summary
            label: Epithet Summary
            i18n: translate
          - widget: markdown
            name: greeting
            label: Greeting
            i18n: translate

      - widget: object
        name: section_about
        label: Section About
        i18n: translate
        fields:
          - widget: string
            name: title
            label: Title
            i18n: translate
          - widget: text
            name: text
            label: About
            i18n: translate
          - widget: text
            name: interests
            label: Learning Interests
            required: false
            i18n: translate

      - widget: object
        name: section_experience
        label: Section Work Experience
        i18n: translate
        fields:
          - widget: string
            name: title
            label: Title
            i18n: translate
          - widget: string
            name: profile_link_label
            label: LinkedIn Link Label
            i18n: translate

      - widget: object
        name: section_contacts
        label: Section Contacts
        i18n: translate
        fields:
          - widget: string
            name: title
            label: Title
            i18n: translate
          - widget: text
            name: proposal
            label: Proposal
            i18n: translate
